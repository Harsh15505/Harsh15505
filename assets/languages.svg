<svg xmlns="http://www.w3.org/2000/svg" width="440" height="300" viewBox="0 0 440 300" role="img" aria-label="Languages I speak">
<style>
  .t{font:700 19px 'Segoe UI',Ubuntu,'Helvetica Neue',sans-serif;fill:#5B4B8A}
  .l{font:600 12.5px 'Segoe UI',Ubuntu,sans-serif;fill:#9A8CC0}
  .v{font:800 22px 'Segoe UI',Ubuntu,sans-serif;fill:#5B4B8A}
  .s{font:600 12px 'Segoe UI',Ubuntu,sans-serif;fill:#5B4B8A}
  .in{opacity:0;animation:fade .6s ease forwards}
  .tw{transform-box:fill-box;transform-origin:center;animation:tw 2.4s ease-in-out infinite}
  .blink{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
  .grow{transform-box:fill-box;transform-origin:left;animation:grow 1s ease forwards;transform:scaleX(0)}
  @keyframes fade{to{opacity:1}}
  @keyframes tw{0%,100%{transform:scale(.6);opacity:.5}50%{transform:scale(1.1);opacity:1}}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
  @keyframes grow{to{transform:scaleX(1)}}
</style>
<rect x="1.5" y="1.5" width="437" height="297" rx="20" fill="#FFF7FB" stroke="#F9C6DA" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="26" y="40" class="t">Languages I speak</text>
<clipPath id="bar"><rect x="26" y="74" width="388" height="14" rx="7"/></clipPath><g clip-path="url(#bar)" class="grow">
