<rect x="219.2" y="74" width="142.6" height="14" fill="#B8A4FF"/>
<rect x="361.3" y="74" width="28.4" height="14" fill="#8FD3FF"/>
<rect x="389.3" y="74" width="11.0" height="14" fill="#A8E6CF"/>
<rect x="399.8" y="74" width="8.4" height="14" fill="#FFD59E"/>
<rect x="407.6" y="74" width="6.9" height="14" fill="#FFB5A7"/>
</g>
<g class="in" style="animation-delay:0.40s"><circle cx="33" cy="132" r="7" fill="#FF8FB1"/><text x="48" y="136" class="s">TypeScript</text><text x="196" y="136" class="l" text-anchor="end">49.4%</text></g>
<g class="in" style="animation-delay:0.55s"><circle cx="233" cy="132" r="7" fill="#B8A4FF"/><text x="248" y="136" class="s">Python</text><text x="396" y="136" class="l" text-anchor="end">36.3%</text></g>
<g class="in" style="animation-delay:0.70s"><circle cx="33" cy="176" r="7" fill="#8FD3FF"/><text x="48" y="180" class="s">JavaScript</text><text x="196" y="180" class="l" text-anchor="end">7.1%</text></g>
<g class="in" style="animation-delay:0.85s"><circle cx="233" cy="176" r="7" fill="#A8E6CF"/><text x="248" y="180" class="s">CSS</text><text x="396" y="180" class="l" text-anchor="end">2.7%</text></g>
<g class="in" style="animation-delay:1.00s"><circle cx="33" cy="220" r="7" fill="#FFD59E"/><text x="48" y="224" class="s">Java</text><text x="196" y="224" class="l" text-anchor="end">2.0%</text></g>
