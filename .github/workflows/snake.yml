name: pastel contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#FF8FB1&color_dots=#FFF0F5,#FFD6E5,#F9B8D2,#E29BD8,#B48CF0
            dist/snake-dark.svg?palette=github-dark&color_snake=#FFB5D0&color_dots=#2B2238,#4A3566,#7A4F9E,#B072C9,#F79AC4
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
