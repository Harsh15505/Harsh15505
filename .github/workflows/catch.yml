name: throw a poke ball

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: profile-write
  cancel-in-progress: false

jobs:
  throw:
    if: startsWith(github.event.issue.title, 'catch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Throw
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: python scripts/profile.py catch
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/encounter.svg data/game.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: a trainer threw a poke ball"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
